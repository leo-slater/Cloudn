name: Release

# 推送 v* 标签（如 v1.0.0）时：构建未签名 IPA，按 docs/release-notes/<标签>.md 发布 GitHub Release。
# 应用内「检查更新」读取 Releases 里第一个 .ipa 附件。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的标签（如 v1.0.0）；标签不存在时在当前分支的最新提交上创建"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build & publish
    runs-on: macos-15
    steps:
      - name: Resolve tag
        id: tag
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check out tag
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          # 标签已存在就构建标签所指的提交；否则构建当前提交，发布时由 gh 在这个提交上创建标签
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then git checkout -q "$TAG"; fi
          echo "TARGET_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "构建 $TAG @ $(git rev-parse --short HEAD)"
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Check version
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION=$(grep -m1 'MARKETING_VERSION' Cloudn.xcodeproj/project.pbxproj | sed -E 's/.*= *([^;]+);/\1/')
          echo "tag=$TAG marketing=$VERSION"
          [ "v$VERSION" = "$TAG" ] || { echo "::error::标签 $TAG 与 MARKETING_VERSION $VERSION 不一致"; exit 1; }
          [ -f "docs/release-notes/$TAG.md" ] || { echo "::error::缺少 docs/release-notes/$TAG.md"; exit 1; }
      - name: Build unsigned IPA
        run: |
          set -o pipefail
          xcodebuild -project Cloudn.xcodeproj -scheme Cloudn -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -5
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Cloudn.app Payload/
          zip -qry "Cloudn-${{ steps.tag.outputs.tag }}.ipa" Payload
          shasum -a 256 "Cloudn-${{ steps.tag.outputs.tag }}.ipa" | tee SHA256SUMS.txt
      - name: Update altstore.json
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION="${TAG#v}"
          BUILD=$(grep -m1 'CURRENT_PROJECT_VERSION' Cloudn.xcodeproj/project.pbxproj | sed -E 's/.*= *([^;]+);/\1/')
          IPA="Cloudn-$TAG.ipa"
          SHA=$(awk '{print $1}' SHA256SUMS.txt)
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          python3 - "$VERSION" "$BUILD" "$DATE" "$TAG" "$IPA" "$SHA" "docs/release-notes/$TAG.md" <<'PY'
          import json, os, sys

          version, build, date, tag, ipa, sha, notes_path = sys.argv[1:8]
          size = os.path.getsize(ipa)
          notes = open(notes_path, encoding="utf-8").read().strip()
          entry = {
              "version": version,
              "buildVersion": build,
              "date": date,
              "localizedDescription": notes,
              "downloadURL": f"https://github.com/mengangs/Cloudn/releases/download/{tag}/{ipa}",
              "size": size,
              "sha256": sha,
              "minOSVersion": "17.0",
          }

          def patch(path):
              with open(path, encoding="utf-8") as f:
                  data = json.load(f)
              versions = [v for v in data["apps"][0].get("versions", []) if v.get("version") != version]
              data["apps"][0]["versions"] = [entry] + versions
              with open(path, "w", encoding="utf-8") as f:
                  json.dump(data, f, ensure_ascii=False, indent=2)
                  f.write("\n")

          patch("altstore.json")
          PY
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "Cloudn-$TAG.ipa" SHA256SUMS.txt altstore.json --clobber
            gh release edit "$TAG" --notes-file "docs/release-notes/$TAG.md"
          else
            gh release create "$TAG" "Cloudn-$TAG.ipa" SHA256SUMS.txt altstore.json --target "$TARGET_SHA" \
              --title "Cloudn ${TAG#v}" --notes-file "docs/release-notes/$TAG.md"
          fi
      - name: Sync altstore.json to main
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          cp altstore.json /tmp/altstore.json
          git fetch origin main
          git checkout -B main origin/main
          cp /tmp/altstore.json altstore.json
          if [ -n "$(git status --porcelain altstore.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add altstore.json
            git commit -m "更新侧载软件源 altstore.json ($TAG)"
            git push origin main || true
          fi
